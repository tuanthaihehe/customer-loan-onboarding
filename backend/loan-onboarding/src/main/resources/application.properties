spring.application.name=loan-onboarding
server.port=${SERVER_PORT:8080}

# Mặc định dùng database thật.
spring.profiles.default=db

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# FPT AI - ID Recognition (OCR)
# Tài liệu: https://docs.fpt.ai/vision/idr/vnm
# PRODUCTION: override bằng biến môi trường FPTAI_API_KEY thay vì lưu key trực tiếp
fptai.ocr.api-url=https://api.fpt.ai/vision/idr/vnm
fptai.ocr.api-key=${FPTAI_API_KEY:qRRIKyiREE0rTidpfS4JFMt0FJa7zED5}

# Multipart upload — giới hạn 5MB theo quy định FPT AI
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB

# Camunda DMN
# LOCAL: đọc decision customerAgeEligibility trong file dmn/customer-kyc-rules.dmn.
# SAAS: gọi decision đã deploy trên Camunda 8 SaaS.
app.camunda.dmn.mode=${APP_CAMUNDA_DMN_MODE:SAAS}
app.camunda.dmn.customer-age-decision-id=${APP_CAMUNDA_CUSTOMER_AGE_DECISION_ID:customerAgeEligibility}

camunda.client.mode=${CAMUNDA_CLIENT_MODE:saas}
camunda.client.auth.client-id=${CAMUNDA_CLIENT_ID:8qqNSSwrZkwHHGPE3a~vY8g4g2UsyUag}
camunda.client.auth.client-secret=${CAMUNDA_CLIENT_SECRET:U8RyyquYefO_.NiOxfPqUCv9pqmYDW_8zxRXNu6UuLEX6Xul1VDO1qtX6OyVg2.g}
camunda.client.cloud.cluster-id=${CAMUNDA_CLUSTER_ID:d7d33992-3d44-4476-86c2-78a250fa5811}
camunda.client.cloud.region=${CAMUNDA_REGION:sin-1}
