spring.application.name=loan-onboarding
server.port=${SERVER_PORT:8080}

# Mặc định dùng database thật theo Flyway SQL trong src/main/resources/db.
spring.profiles.default=db

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# FPT AI - ID Recognition (OCR)
# Tài liệu: https://docs.fpt.ai/vision/idr/vnm
# PRODUCTION: override bằng biến môi trường FPTAI_API_KEY thay vì lưu key trực tiếp.
fptai.ocr.api-url=https://api.fpt.ai/vision/idr/vnm/
fptai.ocr.api-key=${FPTAI_API_KEY:4bJQ260mMGnatYeR3uk07xS7V3QkL1I1}

# Multipart upload - giới hạn 5MB theo quy định FPT AI.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB

# AWS S3 document storage
# Khuyến nghị production: dùng IAM role hoặc inject các biến môi trường bên dưới.
app.storage.s3.region=${AWS_REGION:ap-southeast-1}
app.storage.s3.bucket=${AWS_S3_BUCKET:}
app.storage.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
app.storage.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.storage.s3.endpoint=${AWS_S3_ENDPOINT:}
app.storage.s3.public-url-base=${AWS_S3_PUBLIC_URL_BASE:}
app.storage.s3.path-style-access-enabled=${AWS_S3_PATH_STYLE_ACCESS_ENABLED:false}
