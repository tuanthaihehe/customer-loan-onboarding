services:
  # ─────────────────────────────────────────────
  # PostgreSQL 17 — database chính của LOS
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: los-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: loan_onboarding
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loan_onboarding"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────
  # Backend Spring Boot — LOS API
  # Swagger UI: http://localhost:8080/swagger-ui/index.html
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend/loan-onboarding
      dockerfile: Dockerfile
    container_name: los-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: db
      DB_URL: jdbc:postgresql://los-postgres:5432/loan_onboarding
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      SERVER_PORT: 8080
      FPTAI_API_KEY: ${FPTAI_API_KEY}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # pgAdmin - PostgreSQL admin UI
  # UI: http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: los-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@f88.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-123456}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DB_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf 'los-postgres:5432:loan_onboarding:postgres:%s\n' "$${PGADMIN_DB_PASSWORD}" > /tmp/pgpass
        chmod 600 /tmp/pgpass
        exec /entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: los-postgres-data
  pgadmin_data:
    name: los-pgadmin-data
