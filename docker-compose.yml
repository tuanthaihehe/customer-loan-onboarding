services:
  # ─────────────────────────────────────────────
  # PostgreSQL 17 — database chính của LOS
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: los-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: loan_onboarding
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loan_onboarding"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────
  # Backend Spring Boot — LOS API
  # Swagger UI: http://localhost:8080/swagger-ui/index.html
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend/loan-onboarding
      dockerfile: Dockerfile
    container_name: los-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: db
      DB_URL: jdbc:postgresql://los-postgres:5432/loan_onboarding
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      SERVER_PORT: 8080
      FPTAI_API_KEY: ${FPTAI_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_S3_PUBLIC_URL_BASE: ${AWS_S3_PUBLIC_URL_BASE:-}
      AWS_S3_PATH_STYLE_ACCESS_ENABLED: ${AWS_S3_PATH_STYLE_ACCESS_ENABLED:-false}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Frontend React/Vite — LOS Web
  # App: http://localhost:5173
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ../FE-F88-CLO/customer_loan_ob
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: los-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: los-postgres-data
